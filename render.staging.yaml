# TEST SYSTEM (staging) for Uma's Books: a second web service plus its own EMPTY
# Postgres database, completely separate from production, running the same code.
#
# !! This file is NOT linked to the production Blueprint on purpose. Render only
# !! reads render.yaml for the existing Blueprint, so merging this file creates
# !! NOTHING and costs nothing. Resources are created only when someone makes a
# !! NEW Blueprint in Render that points at THIS file:
# !!   Render dashboard > New + > Blueprint > pick the repository >
# !!   Blueprint file path: render.staging.yaml
# Full step by step (what to type, secret or not): docs/runbook.md, section
# "Test system (staging)".
#
# Safety rules built in (src/lib/staging.js, switched on by APP_ENV=staging):
#   - no email reaches a real person: every message goes to STAGING_MAIL_TO,
#     or is not sent at all when that is empty;
#   - the service refuses to start with live HelloAsso credentials, or when
#     DATABASE_URL is the production database host (PRODUCTION_DATABASE_HOST);
#   - red "TEST SITE" banner, noindex, robots.txt Disallow, empty sitemap.
# No production secret belongs in this file or in the staging Environment.

databases:
  - name: umas-books-staging-db
    # Cheapest PAID tier (the free Postgres tier is deleted after 30 days).
    # Check Render pricing before creating.
    plan: basic-256mb
    # Same region as production.
    region: frankfurt
    databaseName: umas_books_staging
    user: umasbooks_staging

services:
  - type: web
    name: umas-books-staging
    runtime: node
    # Cheapest always-on tier. Check Render pricing before creating.
    plan: starter
    region: frankfurt
    rootDir: umas-books
    # Staging follows main: every merge to main redeploys it, so it always shows
    # what production would run next.
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - "**"
    buildCommand: npm ci --omit=dev
    # Same as production.
    preDeployCommand: npm run migrate
    startCommand: npm run seed; npm start
    envVars:
      # ---- Environment variables (plain values, visible in the file) ----
      - key: NODE_ENV
        value: production
      # The one switch for everything above (src/lib/staging.js).
      - key: APP_ENV
        value: staging
      # PREVIEW_MODE is deliberately NOT set: on the test site reservations and
      # the membership form WORK (membership payment only against the HelloAsso
      # sandbox, see below). The red TEST SITE banner, noindex, robots.txt and
      # the empty sitemap come from APP_ENV=staging, with or without it. Add
      # PREVIEW_MODE=true in Render > Environment only to rehearse "coming soon".
      # Same as production (Render's edge plus its internal proxy).
      - key: TRUST_PROXY_HOPS
        value: "2"
      # HelloAsso SANDBOX address. The service refuses to start if HelloAsso
      # credentials are added without this. Sandbox credentials
      # (HELLOASSO_CLIENT_ID / _CLIENT_SECRET / _ORG_SLUG) are NOT in this file:
      # add them later in Environment, only if you test membership payment.
      - key: HELLOASSO_API_BASE
        value: https://api.helloasso-sandbox.com/v5
      # ---- Generated by Render, different from production ----
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # ---- Secrets: Render asks you to type each one when you create the
      # Blueprint (sync: false = never stored in this repository) ----
      # The ONLY mailbox the test site may write to. Use your own address.
      - key: STAGING_MAIL_TO
        sync: false
      # The test site's mail sender: use a SEPARATE Gmail account and app
      # password for staging, never production's.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # First admin of the (empty) staging database; created at first start by
      # the seed (src/seed.js). Delete SEED_ADMIN_PASSWORD afterwards.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Extra safety: the PRODUCTION database host name (Render > umas-books-db >
      # Info > Hostname, the "dpg-..." part). Staging refuses to start if its
      # DATABASE_URL ever points there. Not a password, but kept out of the repo.
      - key: PRODUCTION_DATABASE_HOST
        sync: false
