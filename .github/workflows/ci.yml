name: CI

# Six independent checks against the umas-books app (the web service —
# the repo's static marketing pages at the root have no build/test step
# of their own). Each job gets its own throwaway Postgres service
# container where needed; none of them touch Render or any real data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Actions minutes: the repository is private and the Free plan has 2,000 minutes
# a month; a full run is about 20 billed minutes (smoke-crawl 10, test 6, the
# other four 1 each). Every job below still ALWAYS runs and reports success, so
# the six required check names never go missing or stay "Pending" (a workflow
# skipped with `paths:` filters would block merges). Instead, the first step of
# each job (.github/scripts/ci-changes.sh) looks at the files a pull request
# changed and the slow steps inside the job are skipped when they cannot matter:
#   - docs-only change (docs/**, *.md): lint, test, migration-test and
#     dependency-audit skip their install and run steps (about 1 minute each);
#   - smoke-crawl runs only when src/, views/, public/, migrations/, scripts/,
#     e2e/, the package files, the marketing pages/assets, render.yaml or .github/
#     changed, and ALWAYS on pushes to main and manual runs;
#   - a new push to the same pull request cancels the run in progress (below).
# secret-scan always runs in full (docs can contain a secret too).
# docs/runbook.md, "GitHub Actions minutes" has the measured numbers.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: umas-books

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its parent: see .github/scripts/ci-changes.sh
      - name: Decide how much CI this change needs
        id: changes
        working-directory: .
        run: bash .github/scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json
      # --ignore-scripts: the only package with an install script is
      # puppeteer (it downloads Chrome, ~150 MB, which only the smoke-crawl
      # job uses). bcryptjs is pure JS and sharp ships prebuilt binaries as
      # optional dependencies, so nothing else needs one.
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

  test:
    # Unit tests (pure functions) plus integration tests that boot the
    # real app as a child process against this job's own Postgres
    # service and hit it over real HTTP (see test/integration/).
    runs-on: ubuntu-latest
    # About 5-6 minutes in practice (the suite is ~2,200 tests); 12 leaves
    # double headroom and stops a hung test burning minutes. The duration is
    # printed in the job summary so the trend is visible before it nears this.
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18 # matches production — see nightly-db-backup.yml
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umasbooks_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/umasbooks_ci
      PGSSLMODE: disable
      SESSION_SECRET: ci-test-session-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its parent: see .github/scripts/ci-changes.sh
      - name: Decide how much CI this change needs
        id: changes
        working-directory: .
        run: bash .github/scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json
      # --ignore-scripts: skips puppeteer's Chrome download (see the lint job).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run migrate
      - name: Run the test suite (and record how long it took)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          start=$(date +%s)
          status=0
          npm test || status=$?
          secs=$(( $(date +%s) - start ))
          echo "Test suite duration: $((secs / 60))m $((secs % 60))s (job limit: 12m)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  migration-test:
    # Proves every migration applies cleanly, in order, to a brand-new
    # database — the same sequence Render's startCommand runs on a fresh
    # deploy (see render.yaml: npm run migrate before the deploy, then
    # npm run seed; npm start) — independent of the "test" job above, which reuses an
    # already-migrated database for speed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umasbooks_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/umasbooks_ci
      PGSSLMODE: disable
      SEED_ADMIN_PASSWORD: "Ci-Test-Passw0rd!"
      # In production a failing seed is logged and startup continues; in CI
      # it must turn the job red.
      SEED_STRICT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its parent: see .github/scripts/ci-changes.sh
      - name: Decide how much CI this change needs
        id: changes
        working-directory: .
        run: bash .github/scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json
      # --ignore-scripts: skips puppeteer's Chrome download (see the lint job).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - name: Apply every migration to a brand-new database
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run migrate
      - name: Seed against the freshly migrated schema
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run seed

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its parent: see .github/scripts/ci-changes.sh
      - name: Decide how much CI this change needs
        id: changes
        working-directory: .
        run: bash .github/scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json
      # --ignore-scripts: skips puppeteer's Chrome download (see the lint job).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # scans the whole repo, not just umas-books/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the current commit
      - name: Install gitleaks
        # The core gitleaks tool (MIT-licensed) fetched directly from its
        # GitHub release, rather than the gitleaks-action wrapper, which
        # gates some usage behind a license for organization accounts.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact -v --exit-code 1

  smoke-crawl:
    # Logs in as five real personas (anonymous, account, member,
    # volunteer, admin) against an actually-running server and walks
    # every reachable page — see scripts/sitemap/README.md. Fails on a
    # server error or a navigation failure, or on a persona whose login
    # didn't actually take (see assert-crawl-ok.js).
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the crawl takes about 10-12 minutes; headroom for slow runners
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umasbooks_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/umasbooks_ci
      PGSSLMODE: disable
      SESSION_SECRET: ci-test-session-secret
      SEED_ADMIN_PASSWORD: "Ci-Test-Passw0rd!"
      # In production a failing seed is logged and startup continues; in CI
      # it must turn the job red.
      SEED_STRICT: "true"
      PORT: "3099"
      # The crawler logs in as an admin persona with just a password; the
      # two-step requirement (ignored in production) is switched off here only.
      ADMIN_2FA_REQUIRED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its parent: see .github/scripts/ci-changes.sh
      - name: Decide how much CI this change needs
        id: changes
        working-directory: .
        run: bash .github/scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.smoke_needed == 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json
      - name: Cache the Chrome that puppeteer downloads
        if: steps.changes.outputs.smoke_needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('umas-books/package-lock.json') }}
      - if: steps.changes.outputs.smoke_needed == 'true'
        run: npm ci
      - if: steps.changes.outputs.smoke_needed == 'true'
        run: npm run migrate
      - name: Seed sample content (so the crawl has real pages to walk)
        if: steps.changes.outputs.smoke_needed == 'true'
        run: npm run seed
      - if: steps.changes.outputs.smoke_needed == 'true'
        run: node scripts/sitemap/seed-crawl-accounts.js

      - name: Start the app
        if: steps.changes.outputs.smoke_needed == 'true'
        run: nohup node src/index.js > server.log 2>&1 &

      - name: Wait for the app to be healthy
        if: steps.changes.outputs.smoke_needed == 'true'
        run: |
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:3099/healthz > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "App never became healthy:"; cat server.log; exit 1

      - if: steps.changes.outputs.smoke_needed == 'true'
        run: node scripts/sitemap/route-inventory.js . > routes.json
      - if: steps.changes.outputs.smoke_needed == 'true'
        run: node scripts/sitemap/crawler.js http://localhost:3099 routes.json > crawl.json
      - if: steps.changes.outputs.smoke_needed == 'true'
        run: node scripts/sitemap/assert-crawl-ok.js crawl.json

      - name: Server log (always shown, for debugging a failure above)
        if: always() && steps.changes.outputs.smoke_needed == 'true'
        run: cat server.log
