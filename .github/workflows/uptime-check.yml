name: Site uptime check

# Hits /healthz (see umas-books/src/index.js) every 30 minutes — that
# route does a real SELECT 1, not just "is the process responding", so
# this actually catches a broken database connection even while the
# homepage keeps returning 200 (see the 2026-09-26 incident: the site
# looked "up" by any naive check the entire time).
#
# Runs on GitHub's own infrastructure, independent of Render, same
# reasoning as the nightly backup — needs to still work if the site
# itself is down. Requires two repo secrets, GMAIL_USER and
# GMAIL_APP_PASSWORD (Settings > Secrets and variables > Actions) — the
# same Gmail account already used by the app for its own mail, just
# added here too since this is a separate secret store from Render's
# environment variables.
#
# Cadence is a billing decision: the repo is private, so Actions minutes
# are metered, and every run is billed as a whole minute. Every 10 minutes
# was ~4,300 billed minutes a month on its own — more than a Pro plan's
# 3,000-minute allowance — and when the allowance runs out, workflows
# (including the nightly database backup) stop running. Every 30 minutes is
# ~1,440 a month and still alerts within about an hour of an outage. For
# faster detection use a free external monitor (UptimeRobot, Better Stack)
# on /healthz instead of raising this.
#
# Email policy: one alert per outage (on the 2nd consecutive failed
# check), then silence, then one "recovered" email. See the "decide" step.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The address to watch. Set the repository VARIABLE SITE_URL (Settings >
      # Secrets and variables > Actions > Variables tab > New repository
      # variable, e.g. https://umasbooks.org, no trailing slash) to change it
      # without editing this file; unset, it falls back to the live domain.
      SITE_URL: ${{ vars.SITE_URL || 'https://umasbooks.org' }}
    steps:
      - name: Check site health
        id: health
        run: |
          # A generous timeout: a restart or deploy can make the first
          # request slow for a while. A single slow or failed check is not
          # an outage — a real outage keeps failing on the *next* check
          # too (see the "decide" step).
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "${SITE_URL%/}/healthz" || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Response: $(cat /tmp/health.json 2>/dev/null)"

      - name: Decide whether to email (alert once, recover once)
        # GitHub itself is the state store: the conclusions of the last few
        # completed runs of this workflow. No separate branch/file needed.
        #
        # Let C = this run (ok / fail), P = the previous run, PP = the one
        # before that. Only runs that concluded `success` or `failure` count:
        # `--status=completed` also returns cancelled/skipped runs, and a
        # cancelled run says nothing about the site, so they are filtered
        # out before picking P and PP. Missing history counts as success.
        #
        #   C=fail, P=fail, PP=ok    -> ALERT      (2nd consecutive failure,
        #                                           sent exactly once)
        #   C=fail, P=ok             -> quiet      (lone blip, maybe a cold start)
        #   C=fail, P=fail, PP=fail  -> quiet      (already alerted; outage goes on)
        #   C=ok,   P=fail, PP=fail  -> RECOVERED  (an alert was sent for this
        #                                           outage, so say it is over)
        #   C=ok,   P=fail, PP=ok    -> quiet      (blip that never alerted)
        #   C=ok,   P=ok             -> quiet
        #
        # Known limit: if the alert email itself fails to send, that run is
        # marked failed like any other, so no second attempt is made for this
        # outage (the Actions tab still shows red runs).
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.health.outputs.status }}
        run: |
          RUNS=$(gh run list --workflow=uptime-check.yml --branch=main --status=completed --limit 15 --json conclusion) || RUNS='[]'
          # Newest first. Keep only real outcomes, then take the first two.
          read -r P PP <<< "$(echo "$RUNS" | jq -r '[.[] | select(.conclusion == "success" or .conclusion == "failure") | .conclusion] | (.[0] // "success") + " " + (.[1] // "success")')"
          echo "Current status: $STATUS; previous run: $P; the one before: $PP"
          ALERT=false
          RECOVERED=false
          if [ "$STATUS" != "200" ]; then
            if [ "$P" = "failure" ] && [ "$PP" = "success" ]; then ALERT=true; fi
          else
            if [ "$P" = "failure" ] && [ "$PP" = "failure" ]; then RECOVERED=true; fi
          fi
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"
          echo "recovered=$RECOVERED" >> "$GITHUB_OUTPUT"

      - name: Send alert email (second consecutive failure, once per outage)
        if: steps.decide.outputs.alert == 'true'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Site health check failing (status ${{ steps.health.outputs.status }})"
          to: admin@umasbooks.org
          from: "Uma's Books Uptime Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            ${{ env.SITE_URL }}/healthz has failed two checks in a row (about 30 minutes apart), status ${{ steps.health.outputs.status }}.

            This means either the site is fully down, or it's up but can't reach the database — /healthz checks both.

            This is the only alert you will get for this outage; a "recovered" email follows when the site is healthy again.

            Render dashboard: https://dashboard.render.com
            Check again: ${{ env.SITE_URL }}/healthz

      - name: Send recovery email (first healthy check after an alerted outage)
        if: steps.decide.outputs.recovered == 'true'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Site health check recovered"
          to: admin@umasbooks.org
          from: "Uma's Books Uptime Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            ${{ env.SITE_URL }}/healthz is responding normally again (status 200).

      - name: Fail this run if the check failed
        # Makes the run's own status (visible in the Actions tab, and
        # what the "decide" step reads on the next run) reflect reality —
        # otherwise a failed health check would show as a green run.
        # Deliberately last, so the email steps above still run first.
        if: steps.health.outputs.status != '200'
        run: exit 1
