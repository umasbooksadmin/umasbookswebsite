name: Nightly inventory export

# Every evening at 21:00 Europe/Paris: a CSV of ALL inventory (one row per
# copy, plus a small per-book file), emailed to ALERT_TO and stored in the
# Backblaze B2 bucket under inventory-exports/. Runs on GitHub's own
# infrastructure, with the same read-only database user as the nightly backup.
# Columns and format: umas-books/src/lib/inventoryExport.js. Set-up and
# how to open the file in Excel: docs/runbook.md, "Nightly inventory export".
#
# No customer data is in the files (status only: no buyer or reservation-holder
# names, emails or phones). The CSV is NEVER uploaded as a GitHub Actions
# artifact and the job log shows counts only, so no inventory data is kept in
# GitHub storage; it lives in the private bucket and in the emails.
#
# Uses only settings that already exist (repository SECRETS DATABASE_URL,
# BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY, GMAIL_USER, GMAIL_APP_PASSWORD;
# repository VARIABLES BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION,
# ALERT_TO). Nothing new to configure.

on:
  schedule:
    # GitHub cron is UTC only. 21:00 Paris is 19:00 UTC in summer (CEST) and
    # 20:00 UTC in winter (CET), but GitHub often starts scheduled runs 2-4
    # hours late (past midnight Paris). The gate (.github/scripts/export-gate.sh)
    # is idempotent and decides for ONE Paris day, which every later step uses
    # (steps.gate.outputs.day): from 21h Paris that day is today, from 0h to 5h
    # it is yesterday (a delayed run still owes yesterday's export). The run
    # goes on only if that day's end-of-day file (written at or after 21:00
    # Paris that day) is not in Backblaze yet; a manual run during the day does
    # not count, so it never cancels the evening export. The other lines are
    # retries that cover a delayed or dropped run (and do nothing once it exists).
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      ignore_time_check:
        description: "Run now, even if it is not 21:00 in Paris (use this for a manual run: it exports the inventory as of now and does not replace tonight's export)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: inventory-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Only go on from 21h in Paris, if that evening's export is not in Backblaze yet
        id: gate
        env:
          IGNORE: ${{ inputs.ignore_time_check }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: bash .github/scripts/export-gate.sh inventory

      - name: Check the settings are all present
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          APP_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$REGION" ] || [ -z "$KEY_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Settings are missing. Needed: DATABASE_URL, BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY (repository secrets) and BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION (repository variables), the same as the nightly backup."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json

      - name: Install the app's runtime dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: umas-books
        run: npm ci --omit=dev --ignore-scripts

      - name: Export the inventory
        if: steps.gate.outputs.run == 'true'
        id: export
        working-directory: umas-books
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAY: ${{ steps.gate.outputs.day }}
        run: |
          # The files are named after the day the gate decided for (yesterday for a run GitHub
          # delayed past midnight), NOT the runner's clock.
          test -n "$DAY" || { echo "::error::The gate did not say which day to export."; exit 1; }
          # Read-only SELECTs. Prints counts and sizes (key=value), never rows.
          node scripts/export-inventory-csv.js --out "$RUNNER_TEMP/inventory" --date "$DAY" > "$RUNNER_TEMP/export-counts.txt"
          cat "$RUNNER_TEMP/export-counts.txt"
          cat "$RUNNER_TEMP/export-counts.txt" >> "$GITHUB_OUTPUT"
          echo "taken=$(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Upload to Backblaze
        if: steps.gate.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          # Backblaze's S3 API predates the AWS CLI's newer default checksum
          # headers; only send/validate them when an operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          DAY: ${{ steps.gate.outputs.day }}
        run: |
          # The folder name is what the bucket's lifecycle rule matches
          # (docs/runbook.md, "Nightly inventory export"): do not rename.
          # inventory_books_<day>.csv goes LAST: export-gate.sh treats it (written at or after
          # 21:00 Paris on <day>) as "that evening's export is done".
          dir="$RUNNER_TEMP/inventory"
          for f in "inventory_${DAY}.csv" "inventory_latest.csv" "inventory_books_${DAY}.csv"; do
            test -s "$dir/$f" || { echo "::error::$f is missing or empty."; exit 1; }
            aws s3 cp "$dir/$f" "s3://${BUCKET}/inventory-exports/$f" --endpoint-url "$ENDPOINT" --only-show-errors
          done
          echo "Uploaded 3 files to ${BUCKET}/inventory-exports/"

      - name: Choose what to attach and the email text
        # Gmail refuses messages over about 25 MB. Beyond 15 MB of CSV (a very
        # large inventory) only the small per-book file is attached and the
        # email says where the full file is.
        if: steps.gate.outputs.run == 'true'
        id: attach
        env:
          DAY: ${{ steps.gate.outputs.day }}
          MANUAL: ${{ steps.gate.outputs.manual }}
          TAKEN: ${{ steps.export.outputs.taken }}
          COPIES: ${{ steps.export.outputs.copies }}
          COPIES_BYTES: ${{ steps.export.outputs.copies_bytes }}
        run: |
          dir="$RUNNER_TEMP/inventory"
          # Say when the snapshot was really taken: a manual run is not "21:00", and a delayed
          # scheduled run is taken after midnight (it is still that evening's export).
          if [ "$MANUAL" = "true" ]; then
            echo "subject=[umas-books] Inventory export ${DAY}, manual run at ${TAKEN#* } (${COPIES} copies)" >> "$GITHUB_OUTPUT"
            echo "intro=Here is the inventory of Uma's Books as of ${TAKEN} Paris time (a manual run, not the scheduled end-of-day export)." >> "$GITHUB_OUTPUT"
          else
            echo "subject=[umas-books] Inventory export ${DAY} (${COPIES} copies)" >> "$GITHUB_OUTPUT"
            echo "intro=Here is the end-of-day inventory of Uma's Books for ${DAY}, taken ${TAKEN} Paris time." >> "$GITHUB_OUTPUT"
          fi
          if [ "$COPIES_BYTES" -le 15000000 ]; then
            echo "files=$dir/inventory_${DAY}.csv,$dir/inventory_books_${DAY}.csv" >> "$GITHUB_OUTPUT"
            echo "note=" >> "$GITHUB_OUTPUT"
          else
            echo "files=$dir/inventory_books_${DAY}.csv" >> "$GITHUB_OUTPUT"
            echo "note=The per-copy file is too big to email (over 15 MB): download it from Backblaze, folder inventory-exports/, file inventory_latest.csv, or from the admin Inventory page." >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        env:
          DAY: ${{ steps.gate.outputs.day }}
          COPIES: ${{ steps.export.outputs.copies }}
          IN_STOCK: ${{ steps.export.outputs.in_stock }}
          RESERVED: ${{ steps.export.outputs.reserved }}
          SOLD: ${{ steps.export.outputs.sold }}
          OTHER: ${{ steps.export.outputs.other }}
          BOOKS: ${{ steps.export.outputs.books }}
          COPIES_BYTES: ${{ steps.export.outputs.copies_bytes }}
          BOOKS_BYTES: ${{ steps.export.outputs.books_bytes }}
        run: |
          {
            echo "## Inventory export ${DAY}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Copies | ${COPIES} (in store ${IN_STOCK}, reserved ${RESERVED}, sold ${SOLD}, other ${OTHER}) |"
            echo "| Books | ${BOOKS} |"
            echo "| inventory_${DAY}.csv | ${COPIES_BYTES} bytes |"
            echo "| inventory_books_${DAY}.csv | ${BOOKS_BYTES} bytes |"
            echo
            echo "Stored in Backblaze under inventory-exports/ and emailed. Counts only: no inventory data is shown here or kept in GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email the inventory
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/send-alert-mail
        with:
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.attach.outputs.subject }}
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from-name: "Uma's Books Inventory Export"
          attachments: ${{ steps.attach.outputs.files }}
          body: |
            ${{ steps.attach.outputs.intro }}

            Copies: ${{ steps.export.outputs.copies }}
              In store: ${{ steps.export.outputs.in_stock }}
              Reserved: ${{ steps.export.outputs.reserved }}
              Sold: ${{ steps.export.outputs.sold }}
              Other (donated or withdrawn): ${{ steps.export.outputs.other }}
            Books (titles): ${{ steps.export.outputs.books }}

            Attached: inventory_${{ steps.gate.outputs.day }}.csv (one row per copy) and inventory_books_${{ steps.gate.outputs.day }}.csv (one row per book, with totals).
            ${{ steps.attach.outputs.note }}

            The files use | between values, no quotes, and a decimal point (4.50). To open in Excel: Data > From Text/CSV, choose Delimiter "Custom" and type |, File Origin "UTF-8".

            The files contain no customer data. A copy of each is stored in Backblaze (private bucket), folder inventory-exports/, and kept for about 90 days. You can also download the current inventory any time from the admin Inventory page: "Download all inventory (CSV)".

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Alert admin if any step above failed
        if: failure()
        uses: ./.github/actions/send-alert-mail
        with:
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Nightly inventory export failed"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from-name: "Uma's Books Backup Monitor"
          body: |
            Tonight's inventory export did not complete successfully (or was only partly done: the Backblaze copy may exist without the email, or the other way round).

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            You can download the current inventory yourself from the admin Inventory page ("Download all inventory (CSV)"). The database backup is a separate job and is not affected.
