name: Monthly accounting export

# French accounting records must be kept 10 years, while the database backups only keep
# 30 days (nightly) and 2 years (monthly). On the 1st of each month at 07:00 Paris time this
# produces the accounting files of the PREVIOUS Paris month with the app's own accounting
# code (umas-books/src/lib/accounting.js, the same as Admin > Reports > Accounting export):
#   accounting_YYYY-MM.csv  the accounting export (CSV: | separated, no quotes, decimal point)
#   till_days_YYYY-MM.csv   the till's end-of-day summary, one row per day
#   summary_YYYY-MM.txt     totals by account and method, counts, receipt range, days not closed
# and (1) emails the two CSVs, (2) stores all three in Backblaze under
# accounting-exports/YYYY/ (plain, NOT encrypted: they hold no personal data and must stay
# readable for 10 years without any key). Re-running a month overwrites the same files.
# A test run of a month that is not over (allow_current_month) is only emailed, marked TEST: it is
# never stored, so it cannot stand in for that month's real export.
#
# The gate is IDEMPOTENT, not time-exact (.github/scripts/export-gate.sh): on days 1-3 of the
# month (Paris), at ANY hour, the run goes on only if last month's
# accounting-exports/YYYY/accounting_YYYY-MM.csv is ABSENT in Backblaze (or was written before the
# month ended, i.e. by an old test run), and ends green with a notice when it exists. So a scheduled run that GitHub delays or drops is simply retried by the
# next cron line (05:00 and 06:00 UTC on the 1st; 05:30 and 06:30 UTC on the 2nd and 3rd), and
# once the file exists the later lines do nothing. backup-freshness.yml emails if the file is
# still missing from the 3rd on. Manual run: Actions > this workflow > Run workflow (optionally a
# month YYYY-MM; the time and file checks are skipped).
#
# Needs: repository SECRET DATABASE_URL (the read-only backup_ro user), the BACKUP_S3_*
# variables/secrets of the nightly backup, GMAIL_USER / GMAIL_APP_PASSWORD. Optional repository
# VARIABLE ACCOUNTING_TO (the treasurer's address, comma separated); else ALERT_TO.
# Nothing is uploaded as a GitHub artifact and no data row is ever printed in the log.
# Docs: docs/runbook.md, section "Keeping records for 10 years".

on:
  schedule:
    - cron: "0 5 1 * *" # 05:00 UTC = 07:00 Paris in summer (CEST), 06:00 in winter
    - cron: "0 6 1 * *" # 06:00 UTC = 08:00 Paris in summer, 07:00 in winter
    - cron: "30 5 2-3 * *" # retry the next days if the file is still missing
    - cron: "30 6 2-3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to export, YYYY-MM (empty = the previous month)"
        required: false
        default: ""
        type: string
      ignore_time_check:
        description: "Run now, whatever the day and whether or not the file already exists"
        required: false
        default: true
        type: boolean
      allow_current_month:
        description: "Test only: allow the current (unfinished) month (emailed marked TEST, not stored in Backblaze)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: accounting-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run only if last month's file is not in Backblaze yet (days 1-3)
        id: gate
        env:
          IGNORE: ${{ inputs.ignore_time_check }}
          MONTH_INPUT: ${{ inputs.month }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: bash .github/scripts/export-gate.sh accounting

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: umas-books/.node-version # the one place the Node version is set
          cache: npm
          cache-dependency-path: umas-books/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: umas-books
        run: npm ci --ignore-scripts

      - name: Check the settings are present
        if: steps.gate.outputs.run == 'true'
        env:
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          APP_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$REGION" ] || [ -z "$KEY_ID" ] || [ -z "$APP_KEY" ] || [ -z "$DATABASE_URL" ]; then
            echo "::error::Settings are missing. Set BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION (repository variables) and BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY, DATABASE_URL (repository secrets). Nothing was exported."
            exit 1
          fi

      - name: Produce the accounting files (read-only)
        id: export
        if: steps.gate.outputs.run == 'true'
        working-directory: umas-books
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONTH: ${{ inputs.month }}
          ALLOW_CURRENT: ${{ inputs.allow_current_month }}
        run: |
          ARGS=(--out "$GITHUB_WORKSPACE/accounting-out")
          if [ -n "$MONTH" ]; then ARGS+=(--month "$MONTH"); fi
          if [ "$ALLOW_CURRENT" = "true" ]; then ARGS+=(--force); fi
          node scripts/export-accounting-month.js "${ARGS[@]}"

      - name: Store the files in Backblaze (plain, kept 10 years)
        if: steps.gate.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          LABEL: ${{ steps.export.outputs.label }}
          FOLDER: ${{ steps.export.outputs.folder }}
          TOTAL: ${{ steps.export.outputs.total }}
          ROWS: ${{ steps.export.outputs.rows }}
          COMPLETE: ${{ steps.export.outputs.complete }}
        run: |
          # A test run of a month that is not over (allow_current_month) is NOT stored: under the real
          # name accounting_<month>.csv it would look like the month's export, and the gate on the 1st
          # would skip the real one. It is still emailed, marked TEST.
          if [ "$COMPLETE" != "true" ]; then
            echo "::notice title=Test run, not stored in Backblaze::${LABEL} is not over yet, so the files are only emailed (marked TEST). The real export of ${LABEL} runs after it ends."
            {
              echo "## Accounting export ${LABEL} (TEST, month not over)"
              echo
              echo "- ${ROWS} accounting rows, total ${TOTAL} EUR"
              echo "- NOT stored in Backblaze: only a finished month is stored."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fixed folder names (the bucket lifecycle rule for accounting-exports/ keeps them 10 years).
          # Plain files on purpose: no personal data, and readable without any key.
          cd "$GITHUB_WORKSPACE/accounting-out"
          for f in "accounting_${LABEL}.csv" "till_days_${LABEL}.csv" "summary_${LABEL}.txt"; do
            test -s "$f" || { echo "::error::$f is missing or empty."; exit 1; }
            case "$f" in *.csv) TYPE="text/csv; charset=utf-8" ;; *) TYPE="text/plain; charset=utf-8" ;; esac
            aws s3 cp "$f" "s3://${BUCKET}/accounting-exports/${FOLDER}/${f}" --endpoint-url "$ENDPOINT" --content-type "$TYPE" --only-show-errors
            echo "Stored accounting-exports/${FOLDER}/${f}"
          done
          {
            echo "## Accounting export ${LABEL}"
            echo
            echo "- ${ROWS} accounting rows, total ${TOTAL} EUR"
            echo "- Stored in Backblaze: accounting-exports/${FOLDER}/ (3 files)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email the two CSV files
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/send-alert-mail
        with:
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] ${{ steps.export.outputs.complete != 'true' && 'TEST ' || '' }}Accounting export ${{ steps.export.outputs.label }}"
          to: ${{ vars.ACCOUNTING_TO || vars.ALERT_TO || 'admin@umasbooks.org' }}
          from-name: "Uma's Books Accounting"
          body: file://accounting-out/email_body.txt
          attachments: accounting-out/accounting_*.csv,accounting-out/till_days_*.csv

      - name: Alert admin if any step above failed
        if: failure()
        uses: ./.github/actions/send-alert-mail
        with:
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Monthly accounting export failed"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from-name: "Uma's Books Backup Monitor"
          body: |
            The monthly accounting export did not complete successfully, so the accounting files for last month were not produced (or not fully stored).

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Once the cause is fixed, open the "Monthly accounting export" workflow in the Actions tab, click "Run workflow" and leave the month empty (or type it as YYYY-MM): the files are simply written again.
