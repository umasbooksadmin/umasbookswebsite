name: Nightly database backup

# Runs entirely on GitHub's own infrastructure, independent of Render —
# the whole point is that this survives even if access to the Render
# account is ever lost again (see the incident that prompted this).
# The dump is uploaded to a PRIVATE Backblaze B2 bucket (S3-compatible).
# It is never committed to this code repository: member data does not
# belong in git history.
# Needs a repository SECRET named DATABASE_URL (Settings > Secrets and
# variables > Actions > Secrets), set to the Render database's *external*
# connection string (Render dashboard > umas-books-db > Connect >
# External Connection String), plus the BACKUP_S3_* settings described in
# the "Check the offsite settings" step below. If any of them is missing
# the job FAILS (and the alert email fires) rather than skipping the backup.
#
# ENCRYPTION: each dump is encrypted on the runner with age BEFORE it is
# uploaded, when the repository VARIABLE BACKUP_AGE_RECIPIENT (an age PUBLIC
# key, "age1...") is set. This job never holds the private key. If the variable
# is not set the backup still runs, UNENCRYPTED, with a prominent warning in
# the job summary, the failure email and a weekly reminder email. Set-up and
# restore: docs/runbook.md section "Encrypting the backups".
#
# YEARLY COPY (10 years): on 2 January (Paris date), AFTER the normal dump, the SAME
# (encrypted) file is also uploaded to <prefix>/yearly/umas_books_full_YYYY-MM-DD.dump.age,
# once per calendar year, and the accounting export of the whole previous year
# (accounting-exports/YYYY/accounting_YYYY-full-year.csv) is stored and emailed. The manual
# input force_yearly does the same right away (the bootstrap test). If encryption is off the
# yearly copy is written too, flagged by the same warning. Docs: docs/runbook.md, section
# "Keeping records for 10 years".

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: # allows a manual "Run workflow" from the Actions tab
    inputs:
      force_monthly:
        description: "Also write the long-term monthly/ copy now, even if it is not the 1st and one already exists this month (default: no)"
        type: boolean
        default: false
      force_yearly:
        description: "Also create the 10-year yearly copy and the previous year's accounting export right now (bootstrap test; the copy is labelled with today's date)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the offsite settings are all present
        # The offsite upload is REQUIRED. Checked first, before anything is
        # dumped, so a missing setting fails fast with a clear message.
        # Repository VARIABLES (Settings > Secrets and variables > Actions >
        # Variables > Repository variables): BACKUP_S3_BUCKET,
        # BACKUP_S3_ENDPOINT (e.g. https://s3.eu-central-003.backblazeb2.com),
        # BACKUP_S3_REGION (e.g. eu-central-003), optional BACKUP_S3_PREFIX
        # (default "store-backups"). Repository SECRETS (same page, Secrets
        # tab > Repository secrets): BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY.
        env:
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          APP_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$REGION" ] || [ -z "$KEY_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Offsite backup settings are missing. Set BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION (repository variables) and BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY (repository secrets). No backup was taken."
            exit 1
          fi

      - name: Check the encryption setting
        # Repository VARIABLE (not a secret: it is a public key) BACKUP_AGE_RECIPIENT.
        # Unset = the backup still runs but is NOT encrypted, loudly. Set but
        # malformed (e.g. the private key pasted by mistake) = the job FAILS:
        # a typo must never silently produce plaintext backups.
        id: enc
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${BACKUP_AGE_RECIPIENT//[[:space:]]/}" ]; then
            echo "::warning title=Backups are not encrypted::BACKUP_AGE_RECIPIENT is not set: tonight's dump is uploaded UNENCRYPTED. See docs/runbook.md, section 'Encrypting the backups'."
            {
              echo "## WARNING: backups are NOT encrypted"
              echo
              echo "The repository variable \`BACKUP_AGE_RECIPIENT\` is not set, so this dump (members' personal data and password hashes) was uploaded to Backblaze **unencrypted**."
              echo "Fix: docs/runbook.md, section *Encrypting the backups*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "encrypt=false" >> "$GITHUB_OUTPUT"
            # One reminder email a week (Mondays, UTC) and on manual runs; the
            # failure email below carries the same warning every time.
            if [ "$(date -u +%u)" = "1" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              echo "nag=true" >> "$GITHUB_OUTPUT"
            fi
          else
            n=$(bash .github/scripts/encrypt-dump.sh --check)
            echo "encrypt=true" >> "$GITHUB_OUTPUT"
            echo "## Backups are encrypted with age (${n} recipient(s))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install age (pinned release, checksum verified)
        if: steps.enc.outputs.encrypt == 'true'
        # Pinned version and SHA-256 of the linux-amd64 tarball (the digest GitHub
        # records for the release asset; also re-computed by hand when pinned).
        # To upgrade: change both values, from the release page
        # https://github.com/FiloSottile/age/releases (never just the version).
        env:
          AGE_VERSION: "1.3.2"
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -fsSL --retry 3 -o age.tgz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tgz" | sha256sum --check --strict -
          tar -xzf age.tgz age/age
          sudo install -m 0755 age/age /usr/local/bin/age
          rm -rf age age.tgz
          age --version

      - name: Install matching PostgreSQL client tools
        # Ubuntu's default apt package can lag behind Render's server
        # version, and pg_dump refuses to dump a server newer than itself.
        # The official PGDG repo always has the current major versions.
        # Installing postgresql-client-18 alongside Ubuntu's own default
        # (currently 16) doesn't make apt/update-alternatives prefer it
        # automatically — invoke /usr/lib/postgresql/18/bin/pg_dump
        # explicitly below rather than relying on the bare `pg_dump` on
        # PATH, which silently kept resolving to the older one.
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump database and upload to Backblaze
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          # Backblaze's S3 API predates the AWS CLI's newer default checksum
          # headers; only send/validate them when an operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          ENCRYPT: ${{ steps.enc.outputs.encrypt }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          FORCE_MONTHLY: ${{ inputs.force_monthly }}
          FORCE_YEARLY: ${{ inputs.force_yearly }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — see this workflow's comments for how to add it."
            exit 1
          fi
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          mkdir -p full
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          FILE="full/umas_books_full_${STAMP}.dump"
          # ONE complete dump, uploaded offsite only (never committed to git).
          # Everything is included — uploaded image bytes too — except login
          # sessions (csrf tokens, role flags), which are not worth keeping.
          # Retries a couple of times before giving up — pg_dump against a
          # remote database over the internet can hit an ordinary transient
          # network blip.
          for attempt in 1 2 3; do
            # pg_dump's error text goes to a file (and is shown): it never
            # contains the connection string, so no secret reaches the log.
            if /usr/lib/postgresql/18/bin/pg_dump --no-owner --no-privileges --format=custom \
                 --exclude-table-data=session \
                 --file="$FILE" "$DATABASE_URL" 2> pg_dump.err; then
              break
            fi
            cat pg_dump.err
            echo "pg_dump attempt $attempt failed."
            if grep -qi 'permission denied' pg_dump.err; then
              # Grants are missing: retrying cannot help. Say so clearly.
              echo "denied=true" >> "$GITHUB_OUTPUT"
              echo "::error title=Backup user lacks read permission::pg_dump reported 'permission denied'. The backup database user is missing SELECT grants. Re-run the GRANT lines in docs/runbook.md, section ad), box 'permission denied for table ...' (A read-only database user for the backup). No backup was taken."
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::pg_dump failed after 3 attempts."
              exit 1
            fi
            rm -f "$FILE"
            sleep 10
          done
          test -s "$FILE" || { echo "::error::$FILE is missing or empty."; exit 1; }
          # Encrypt BEFORE anything leaves the runner (see .github/scripts/encrypt-dump.sh:
          # writes $FILE.age, verifies the age header, deletes the plaintext).
          UPLOAD="$FILE"
          if [ "$ENCRYPT" = "true" ]; then
            bash .github/scripts/encrypt-dump.sh "$FILE"
            UPLOAD="$FILE.age"
          fi
          # The prefix and folder names below are what the bucket's lifecycle
          # rules match (full/ = 30 days, monthly/ = 730 days) — don't rename.
          # The CLI exits non-zero if an upload fails.
          aws s3 cp "$UPLOAD" "s3://${BUCKET}/${PREFIX}/full/$(basename "$UPLOAD")" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded ($(du -h "$UPLOAD" | cut -f1)) to ${BUCKET}/${PREFIX}/full/$(basename "$UPLOAD")"
          # Long-term copy (monthly/): at most ONE per calendar month (UTC). It is
          # written when none exists yet this month AND (today is the 1st, OR no
          # monthly copy exists at all: bootstrap, so the first month is covered
          # at once). A manual run with force_monthly=true writes it regardless.
          # The list query is null-safe: an empty folder returns "Contents: null".
          NEWEST_MONTHLY=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                             --prefix "${PREFIX}/monthly/umas_books_full_" --delimiter "/" \
                             --query 'sort_by(Contents || `[]`, &LastModified)[-1].LastModified' --output text)
          THIS_MONTH=$(date -u +%Y-%m)
          WRITE_MONTHLY=no
          if [ "$FORCE_MONTHLY" = "true" ]; then
            WRITE_MONTHLY=yes
          elif [ -z "$NEWEST_MONTHLY" ] || [ "$NEWEST_MONTHLY" = "None" ]; then
            WRITE_MONTHLY=yes # bootstrap: no monthly copy exists at all
          elif [ "$(date -u +%d)" = "01" ] && [ "${NEWEST_MONTHLY:0:7}" != "$THIS_MONTH" ]; then
            WRITE_MONTHLY=yes
          fi
          if [ "$WRITE_MONTHLY" = "yes" ]; then
            aws s3 cp "$UPLOAD" "s3://${BUCKET}/${PREFIX}/monthly/$(basename "$UPLOAD")" --endpoint-url "$ENDPOINT" --only-show-errors
            echo "Monthly copy written."
          else
            echo "No monthly copy needed today (newest: ${NEWEST_MONTHLY})."
          fi
          # Yearly copy, kept 10 years (the bucket lifecycle rule for yearly/ is set by hand):
          # on 2 January, Paris date, or when force_yearly is ticked. Once per calendar year:
          # skipped if a yearly object of this year already exists (a manual force always writes).
          PARIS_DATE=$(TZ=Europe/Paris date +%F)
          YEAR="${PARIS_DATE%%-*}"
          if [ "$FORCE_YEARLY" = "true" ] || [ "$(TZ=Europe/Paris date +%m-%d)" = "01-02" ]; then
            # shellcheck disable=SC2016  # the backticks are JMESPath literals, not shell
            EXISTING=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                         --prefix "${PREFIX}/yearly/umas_books_full_${YEAR}-" \
                         --query 'length(Contents || `[]`)' --output text)
            if [ "${EXISTING:-0}" != "0" ] && [ "$FORCE_YEARLY" != "true" ]; then
              echo "A yearly copy for ${YEAR} already exists: not written again."
            else
              case "$UPLOAD" in *.age) YEXT=".dump.age" ;; *) YEXT=".dump" ;; esac
              aws s3 cp "$UPLOAD" "s3://${BUCKET}/${PREFIX}/yearly/umas_books_full_${PARIS_DATE}${YEXT}" --endpoint-url "$ENDPOINT" --only-show-errors
              echo "Yearly copy written: ${PREFIX}/yearly/umas_books_full_${PARIS_DATE}${YEXT}"
              if [ "$ENCRYPT" != "true" ]; then
                echo "::warning title=Yearly copy is not encrypted::BACKUP_AGE_RECIPIENT is not set: the 10-year copy is UNENCRYPTED. See docs/runbook.md, section 'Encrypting the backups'."
              fi
              echo "yearly=true" >> "$GITHUB_OUTPUT"
              echo "- Yearly copy (10 years): \`yearly/umas_books_full_${PARIS_DATE}${YEXT}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.dump.outputs.yearly == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: umas-books/package-lock.json

      - name: Install dependencies for the yearly accounting export
        if: steps.dump.outputs.yearly == 'true'
        working-directory: umas-books
        run: npm ci --ignore-scripts

      - name: Yearly accounting export (the whole previous year, read-only)
        # Reuses scripts/export-accounting-month.js in year mode: the last complete year
        # (the financial year starts in the repository VARIABLE FISCAL_YEAR_START_MONTH,
        # default 1 = January). Plain files (no personal data), kept 10 years.
        id: yearly
        if: steps.dump.outputs.yearly == 'true'
        working-directory: umas-books
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FISCAL_YEAR_START_MONTH: ${{ vars.FISCAL_YEAR_START_MONTH }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          node scripts/export-accounting-month.js --year last --out "$GITHUB_WORKSPACE/accounting-out"
          cd "$GITHUB_WORKSPACE/accounting-out"
          LABEL=""
          for f in accounting_*-full-year.csv; do LABEL="${f#accounting_}"; LABEL="${LABEL%.csv}"; done
          test -n "$LABEL" || { echo "::error::No yearly accounting file was produced."; exit 1; }
          FOLDER="${LABEL%%-*}"
          for f in "accounting_${LABEL}.csv" "till_days_${LABEL}.csv" "summary_${LABEL}.txt"; do
            test -s "$f" || { echo "::error::$f is missing or empty."; exit 1; }
            case "$f" in *.csv) TYPE="text/csv; charset=utf-8" ;; *) TYPE="text/plain; charset=utf-8" ;; esac
            aws s3 cp "$f" "s3://${BUCKET}/accounting-exports/${FOLDER}/${f}" --endpoint-url "$ENDPOINT" --content-type "$TYPE" --only-show-errors
            echo "Stored accounting-exports/${FOLDER}/${f}"
          done
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Email the yearly accounting files
        if: steps.dump.outputs.yearly == 'true'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Accounting export ${{ steps.yearly.outputs.label }}"
          to: ${{ vars.ACCOUNTING_TO || vars.ALERT_TO || 'admin@umasbooks.org' }}
          from: "Uma's Books Accounting <${{ secrets.GMAIL_USER }}>"
          body: file://accounting-out/email_body.txt
          attachments: accounting-out/accounting_*.csv,accounting-out/till_days_*.csv

      - name: Alert admin if any step above failed
        # `if: failure()` here means "some earlier step in this job
        # failed" — a missed backup only gets one shot until the next
        # scheduled run 24h away, so unlike the uptime check this alerts
        # on the very first failure rather than waiting for a second.
        # Requires GMAIL_USER/GMAIL_APP_PASSWORD as repo secrets — the
        # same Gmail account already used by the app for its own mail.
        if: failure()
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Nightly database backup failed"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from: "Uma's Books Backup Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            Tonight's database backup did not complete successfully.

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ steps.dump.outputs.denied == 'true' && 'LIKELY CAUSE: pg_dump reported "permission denied". The read-only backup database user is missing SELECT grants (for example after Render restored the database). Re-run the GRANT lines in docs/runbook.md, section "A read-only database user for the backup", box "permission denied for table ...".' || '' }}

            Previous backups in Backblaze are unaffected, so nothing already saved is lost — but there won't be a new one until this is fixed and the workflow runs again.
            ${{ steps.enc.outputs.encrypt == 'false' && 'ALSO: backups are not encrypted (the repository variable BACKUP_AGE_RECIPIENT is not set). See docs/runbook.md, section Encrypting the backups.' || '' }}

      - name: Remind the admin that backups are not encrypted
        # Weekly (Mondays UTC) and on manual runs, only while BACKUP_AGE_RECIPIENT
        # is unset and the backup itself succeeded (a failure sends the email above).
        if: success() && steps.enc.outputs.nag == 'true'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Database backups are NOT encrypted"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from: "Uma's Books Backup Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            The nightly database backups in Backblaze are stored WITHOUT encryption: they contain all members' personal data and password hashes.

            Fix (about 15 minutes, once): follow docs/runbook.md, section "Encrypting the backups": create an age key pair on your Mac and save its PUBLIC key as the repository variable BACKUP_AGE_RECIPIENT.

            This reminder is sent every Monday until the variable is set. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
