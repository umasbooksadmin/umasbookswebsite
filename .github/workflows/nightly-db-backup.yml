name: Nightly database backup

# Runs entirely on GitHub's own infrastructure, independent of Render —
# the whole point is that this survives even if access to the Render
# account is ever lost again (see the incident that prompted this).
# The dump is uploaded to a PRIVATE Backblaze B2 bucket (S3-compatible).
# It is never committed to this code repository: member data does not
# belong in git history.
# Needs a repository SECRET named DATABASE_URL (Settings > Secrets and
# variables > Actions > Secrets), set to the Render database's *external*
# connection string (Render dashboard > umas-books-db > Connect >
# External Connection String), plus the BACKUP_S3_* settings described in
# the "Check the offsite settings" step below. If any of them is missing
# the job FAILS (and the alert email fires) rather than skipping the backup.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {} # allows a manual "Run workflow" from the Actions tab

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the offsite settings are all present
        # The offsite upload is REQUIRED. Checked first, before anything is
        # dumped, so a missing setting fails fast with a clear message.
        # Repository VARIABLES (Settings > Secrets and variables > Actions >
        # Variables > Repository variables): BACKUP_S3_BUCKET,
        # BACKUP_S3_ENDPOINT (e.g. https://s3.eu-central-003.backblazeb2.com),
        # BACKUP_S3_REGION (e.g. eu-central-003), optional BACKUP_S3_PREFIX
        # (default "store-backups"). Repository SECRETS (same page, Secrets
        # tab > Repository secrets): BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY.
        env:
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          APP_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$REGION" ] || [ -z "$KEY_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Offsite backup settings are missing. Set BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION (repository variables) and BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY (repository secrets). No backup was taken."
            exit 1
          fi

      - name: Install matching PostgreSQL client tools
        # Ubuntu's default apt package can lag behind Render's server
        # version, and pg_dump refuses to dump a server newer than itself.
        # The official PGDG repo always has the current major versions.
        # Installing postgresql-client-18 alongside Ubuntu's own default
        # (currently 16) doesn't make apt/update-alternatives prefer it
        # automatically — invoke /usr/lib/postgresql/18/bin/pg_dump
        # explicitly below rather than relying on the bare `pg_dump` on
        # PATH, which silently kept resolving to the older one.
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump database and upload to Backblaze
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          # Backblaze's S3 API predates the AWS CLI's newer default checksum
          # headers; only send/validate them when an operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — see this workflow's comments for how to add it."
            exit 1
          fi
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          mkdir -p full
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          FILE="full/umas_books_full_${STAMP}.dump"
          # ONE complete dump, uploaded offsite only (never committed to git).
          # Everything is included — uploaded image bytes too — except login
          # sessions (csrf tokens, role flags), which are not worth keeping.
          # Retries a couple of times before giving up — pg_dump against a
          # remote database over the internet can hit an ordinary transient
          # network blip.
          for attempt in 1 2 3; do
            if /usr/lib/postgresql/18/bin/pg_dump --no-owner --no-privileges --format=custom \
                 --exclude-table-data=session \
                 --file="$FILE" "$DATABASE_URL"; then
              break
            fi
            echo "pg_dump attempt $attempt failed."
            if [ "$attempt" = 3 ]; then
              echo "::error::pg_dump failed after 3 attempts."
              exit 1
            fi
            rm -f "$FILE"
            sleep 10
          done
          test -s "$FILE" || { echo "::error::$FILE is missing or empty."; exit 1; }
          # The prefix and folder names below are what the bucket's lifecycle
          # rules match (full/ = 30 days, monthly/ = 730 days) — don't rename.
          # The CLI exits non-zero if an upload fails.
          aws s3 cp "$FILE" "s3://${BUCKET}/${PREFIX}/full/$(basename "$FILE")" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded ($(du -h "$FILE" | cut -f1)) to ${BUCKET}/${PREFIX}/full/$(basename "$FILE")"
          # On the 1st of the month (UTC) also keep a long-term copy.
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "$FILE" "s3://${BUCKET}/${PREFIX}/monthly/$(basename "$FILE")" --endpoint-url "$ENDPOINT" --only-show-errors
            echo "Monthly copy written."
          fi

      - name: Alert admin if any step above failed
        # `if: failure()` here means "some earlier step in this job
        # failed" — a missed backup only gets one shot until the next
        # scheduled run 24h away, so unlike the uptime check this alerts
        # on the very first failure rather than waiting for a second.
        # Requires GMAIL_USER/GMAIL_APP_PASSWORD as repo secrets — the
        # same Gmail account already used by the app for its own mail.
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Nightly database backup failed"
          to: admin@umasbooks.org
          from: "Uma's Books Backup Monitor"
          body: |
            Tonight's database backup did not complete successfully.

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Previous backups in Backblaze are unaffected, so nothing already saved is lost — but there won't be a new one until this is fixed and the workflow runs again.
