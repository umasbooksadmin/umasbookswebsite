name: Nightly database backup

# Runs entirely on GitHub's own infrastructure, independent of Render —
# the whole point is that this survives even if access to the Render
# account is ever lost again (see the incident that prompted this).
# Requires a repo secret named DATABASE_URL (Settings > Secrets and
# variables > Actions), set to the Render database's *external*
# connection string (Render dashboard > umas-books-db > Connect >
# External Connection String). This repo is private — dumps contain
# member names/emails/order details, so this must never be enabled on a
# public repo or with a public runner cache.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {} # allows a manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a public repository
        # Dumps contain member names/emails/order details and get pushed to
        # the db-backups branch — on a public repo that branch is world-
        # readable. Checked first, before anything is dumped or pushed, and
        # fails the job so the alert email below fires too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::This repository is public — refusing to push database dumps to it. Make the repo private, then re-run."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need branch history to check out/create db-backups below

      - name: Install matching PostgreSQL client tools
        # Ubuntu's default apt package can lag behind Render's server
        # version, and pg_dump refuses to dump a server newer than itself.
        # The official PGDG repo always has the current major versions.
        # Installing postgresql-client-18 alongside Ubuntu's own default
        # (currently 16) doesn't make apt/update-alternatives prefer it
        # automatically — invoke /usr/lib/postgresql/18/bin/pg_dump
        # explicitly below rather than relying on the bare `pg_dump` on
        # PATH, which silently kept resolving to the older one.
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — see this workflow's comments for how to add it."
            exit 1
          fi
          mkdir -p backup
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Retries a couple of times before giving up — pg_dump against a
          # remote database over the internet can hit an ordinary transient
          # network blip.
          for attempt in 1 2 3; do
            if /usr/lib/postgresql/18/bin/pg_dump --no-owner --no-privileges --format=custom \
                 --file="backup/umas_books_${STAMP}.dump" "$DATABASE_URL"; then
              break
            fi
            echo "pg_dump attempt $attempt failed."
            if [ "$attempt" = 3 ]; then
              echo "::error::pg_dump failed after 3 attempts."
              exit 1
            fi
            rm -f "backup/umas_books_${STAMP}.dump"
            sleep 10
          done

      - name: Commit dump to the db-backups branch
        run: |
          git config user.name "db-backup-bot"
          git config user.email "actions@users.noreply.github.com"

          # actions/checkout configures a narrow fetch refspec (just the
          # default branch), so fetch db-backups with an explicit refspec
          # rather than relying on it landing in refs/remotes/origin/*.
          git fetch origin db-backups:refs/remotes/origin/db-backups || true
          if git show-ref --verify --quiet refs/remotes/origin/db-backups; then
            git checkout db-backups
          else
            git checkout --orphan db-backups
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p backups
          mv "backup/umas_books_${STAMP}.dump" "backups/umas_books_${STAMP}.dump"
          git add "backups/umas_books_${STAMP}.dump"

          # Keep a rolling 30 nightly backups so the branch doesn't grow forever.
          cd backups
          ls -1t umas_books_*.dump | tail -n +31 | xargs -r git rm --
          cd ..

          git commit -m "Nightly backup ${STAMP}"
          git push origin db-backups

      # ---- Second copy in offsite storage (Backblaze B2, S3-compatible) ----
      # Runs AFTER the db-backups commit above on purpose: if the offsite
      # storage is misconfigured the GitHub copy still exists for the night,
      # and the failure email below still fires. Skipped (with a notice)
      # until the settings exist, so this can't break the existing backup.
      # Repository VARIABLES (Settings > Secrets and variables > Actions >
      # Variables > Repository variables): BACKUP_S3_BUCKET,
      # BACKUP_S3_ENDPOINT (e.g. https://s3.eu-central-003.backblazeb2.com),
      # BACKUP_S3_REGION (e.g. eu-central-003), optional BACKUP_S3_PREFIX
      # (default "store-backups"). Repository SECRETS (same page, Secrets
      # tab > Repository secrets): BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY.
      - name: Is the offsite upload configured?
        id: offsite
        env:
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          APP_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
        run: |
          if [ -n "$BUCKET" ] && [ -n "$ENDPOINT" ] && [ -n "$REGION" ] && [ -n "$KEY_ID" ] && [ -n "$APP_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Offsite upload skipped — BACKUP_S3_BUCKET/ENDPOINT/REGION (repository variables) and BACKUP_S3_KEY_ID/APPLICATION_KEY (repository secrets) are not all set yet."
          fi

      - name: Upload dump to offsite storage
        if: steps.offsite.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          # Backblaze's S3 API predates the AWS CLI's newer default checksum
          # headers; only send/validate them when an operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          FILE="backups/umas_books_${STAMP}.dump" # still in the working tree after the commit step
          test -s "$FILE" || { echo "::error::$FILE is missing or empty."; exit 1; }
          # The CLI exits non-zero if the upload fails. Encryption at rest is
          # the bucket's own default-encryption setting (see README).
          aws s3 cp "$FILE" "s3://${BUCKET}/${PREFIX}/$(basename "$FILE")" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded to ${BUCKET}/${PREFIX}/$(basename "$FILE")"
          # Keep one backup per month under monthly/ as a long-term copy
          # (retention itself is the bucket's lifecycle rule — see README).
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "$FILE" "s3://${BUCKET}/${PREFIX}/monthly/$(basename "$FILE")" --endpoint-url "$ENDPOINT" --only-show-errors
            echo "Monthly copy written."
          fi

      - name: Alert admin if any step above failed
        # `if: failure()` here means "some earlier step in this job
        # failed" — a missed backup only gets one shot until the next
        # scheduled run 24h away, so unlike the uptime check this alerts
        # on the very first failure rather than waiting for a second.
        # Requires GMAIL_USER/GMAIL_APP_PASSWORD as repo secrets — the
        # same Gmail account already used by the app for its own mail.
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Nightly database backup failed"
          to: admin@umasbooks.org
          from: "Uma's Books Backup Monitor"
          body: |
            Tonight's database backup did not complete successfully.

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The last successful backup is still on the db-backups branch, so nothing already saved is lost — but there won't be a new one until this is fixed and the workflow runs again.
