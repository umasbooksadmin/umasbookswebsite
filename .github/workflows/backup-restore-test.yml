name: Monthly backup restore test

# A backup nobody has ever restored is a hope, not a backup. Once a month
# (and on demand) this downloads the NEWEST dump under <prefix>/full/ from
# the private Backblaze B2 bucket (written by nightly-db-backup.yml) and
# restores it into a throwaway postgres:18 service container, then checks
# that the data is really there. Nothing here touches Render or any real
# database.
#
# Needs the BACKUP_S3_* repository variables/secrets (the application key
# needs READ access: listFiles + readFiles) and the GMAIL_USER /
# GMAIL_APP_PASSWORD repo secrets for the failure email. The README section
# "Restoring from a backup" has the manual version of these same steps.

on:
  schedule:
    - cron: "0 5 1 * *" # 05:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18 # matches production and nightly-db-backup.yml
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: restore_test
    steps:
      - name: Check out the migration files (to compare with the dump)
        # Only umas-books/migrations, with history (no file contents beyond that
        # folder): the sanity check below needs the highest migration number in
        # the repository and when each newer file was added.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: umas-books/migrations
          fetch-depth: 0
          filter: blob:none

      - name: Download the newest dump from Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          REGION: ${{ vars.BACKUP_S3_REGION }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$REGION" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Offsite backup settings are missing. Set BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION (repository variables) and BACKUP_S3_KEY_ID, BACKUP_S3_APPLICATION_KEY (repository secrets)."
            exit 1
          fi
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          # --delimiter keeps the lookup to direct children of full/;
          # filenames embed a UTC timestamp, so sorting by key is chronological.
          KEY=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                  --prefix "${PREFIX}/full/umas_books_full_" --delimiter "/" \
                  --query 'sort_by(Contents, &Key)[-1].Key' --output text || true)
          if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
            echo "::error::No backup dumps found under ${BUCKET}/${PREFIX}/full/ — has the nightly backup ever run successfully?"
            exit 1
          fi
          echo "Newest dump: ${BUCKET}/${KEY}"
          aws s3 cp "s3://${BUCKET}/${KEY}" restore.dump --endpoint-url "$ENDPOINT" --only-show-errors
          test -s restore.dump || { echo "::error::Downloaded dump is empty."; exit 1; }
          echo "Downloaded ($(du -h restore.dump | cut -f1))"
          echo "DUMP=restore.dump" >> "$GITHUB_ENV"

      - name: Install matching PostgreSQL client tools
        # Same reasoning as nightly-db-backup.yml: pg_restore from an older
        # client can't read a dump made by a newer pg_dump, and the bare
        # `pg_restore` on PATH resolves to Ubuntu's older default. Use the
        # version-18 binaries explicitly below.
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Restore the dump
        # Same flags the manual procedure in the README uses. --exit-on-error
        # makes any problem fail this job instead of being skipped silently.
        run: |
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges --exit-on-error \
            --dbname="$PGDATABASE" "$DUMP"

      - name: Sanity-check the restored data
        run: |
          PSQL="/usr/lib/postgresql/18/bin/psql -v ON_ERROR_STOP=1 -tA"
          fail=0

          # The dump must contain every migration the repository had when the
          # dump was taken. Compares the newest filename recorded in the dump
          # with the newest file in umas-books/migrations. A migration merged
          # in the last 30 hours is not an error (the nightly dump simply
          # predates it); an older one means the dump is stale or incomplete.
          REPO_LATEST=$(ls umas-books/migrations/*.sql | xargs -n1 basename | sort | tail -1)
          DUMP_LATEST=$($PSQL -c "SELECT max(filename) FROM public.schema_migrations" 2>/dev/null || echo "")
          echo "newest migration in the repository: $REPO_LATEST; in the dump: ${DUMP_LATEST:-none}"
          if [ -z "$DUMP_LATEST" ]; then
            echo "::error::schema_migrations is empty or unreadable in the dump."
            fail=1
          elif [[ "$DUMP_LATEST" < "$REPO_LATEST" ]]; then
            NOW=$(date -u +%s)
            for f in $(ls umas-books/migrations/*.sql | xargs -n1 basename | sort); do
              if [[ "$f" > "$DUMP_LATEST" ]]; then
                ADDED=$(git log --diff-filter=A --format=%ct -- "umas-books/migrations/$f" | tail -1)
                AGE_H=$(( (NOW - ${ADDED:-0}) / 3600 ))
                if [ "$AGE_H" -gt 30 ]; then
                  echo "::error::The dump is OLDER than the repository: it lacks migration $f, which was added ${AGE_H} hours ago (newest in the dump: $DUMP_LATEST). The nightly backup is stale, or it dumped the wrong database."
                  fail=1
                else
                  echo "::warning::The dump predates migration $f (added ${AGE_H} hours ago): expected right after a deploy."
                fi
              fi
            done
          fi

          # Tables that must exist (a missing one makes the count query error):
          # the core ones, plus everything the till, the shop and the email
          # outbox keep, so a dump that silently lost them cannot pass.
          for t in users books book_copies orders schema_migrations \
                   till_sales till_days till_sale_items till_quick_items shop_sales \
                   email_outbox membership_payments admin_audit_log images; do
            if ! $PSQL -c "SELECT count(*) FROM public.$t" > /dev/null 2>&1; then
              echo "::error::Table public.$t is missing or unreadable after restore."
              fail=1
            fi
          done

          # Row counts that must be non-zero for a real, populated site.
          for t in users books schema_migrations; do
            n=$($PSQL -c "SELECT count(*) FROM public.$t" 2>/dev/null || echo 0)
            echo "public.$t: $n rows"
            if [ "${n:-0}" -lt 1 ]; then
              echo "::error::public.$t has no rows after restore."
              fail=1
            fi
          done

          # The site always has at least one admin (npm run seed guarantees it).
          admins=$($PSQL -c "SELECT count(*) FROM public.users WHERE is_admin" 2>/dev/null || echo 0)
          echo "admin users: $admins"
          if [ "${admins:-0}" -lt 1 ]; then
            echo "::error::No admin user in the restored data."
            fail=1
          fi

          # Image bytes. The images table must exist. If the dump has image
          # rows, at least one must carry data (the dump includes image
          # bytes), and every /img/ URL in use must resolve to a stored image.
          if ! $PSQL -c "SELECT count(*) FROM public.images" > /dev/null 2>&1; then
            echo "::error::Table public.images is missing after restore."
            fail=1
          else
            rows=$($PSQL -c "SELECT count(*) FROM public.images" 2>/dev/null || echo 0)
            echo "public.images: $rows rows"
            if [ "${rows:-0}" -gt 0 ]; then
              withdata=$($PSQL -c "SELECT count(*) FROM public.images WHERE length(data) > 0" 2>/dev/null || echo 0)
              echo "images with data: $withdata"
              if [ "${withdata:-0}" -lt 1 ]; then
                echo "::error::The images table has $rows row(s) but none have image bytes — the backup is missing images."
                fail=1
              fi
            fi
            missing=$($PSQL -c "
              SELECT count(*) FROM (
                SELECT cover_url AS u FROM public.books
                UNION ALL SELECT image_url FROM public.announcements
                UNION ALL SELECT image_url FROM public.charities
                UNION ALL SELECT image_url FROM public.blog_posts
              ) x
              WHERE u ~ '^/img/[0-9a-f]{64}\\.' AND NOT EXISTS (
                SELECT 1 FROM public.images i WHERE i.id = substring(x.u FROM 6 FOR 64))" 2>/dev/null || echo "-1")
            echo "image URLs with no stored bytes: $missing"
            if [ "$missing" != "0" ]; then
              echo "::error::The dump is missing image bytes for $missing image URL(s)."
              fail=1
            fi
          fi

          exit $fail

      - name: Alert admin if the restore test failed
        # Unlike the uptime check this alerts on the first failure: the job
        # runs once a month, so a silent miss would go unnoticed for weeks.
        if: failure()
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] Backup restore test FAILED"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from: "Uma's Books Backup Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            The monthly test that restores the newest database backup into a scratch database did not pass.

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Until this is resolved, do not assume the backups in Backblaze are restorable.
