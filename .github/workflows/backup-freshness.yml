name: Backup freshness check

# The nightly backup workflow emails when it FAILS, but cannot email if it
# never runs at all (workflow disabled, schedule dropped, GitHub outage).
# This separate daily check looks at Backblaze itself and emails if the
# newest nightly dump is missing or older than MAX_AGE_HOURS, and (from the 4th
# of each month) if the long-term monthly/ copy is older than 35 days.
# Before the FIRST monthly copy exists the check only shows a notice (until the
# oldest backup is 35 days old); the nightly job writes the first copy at once.
# Needs the same BACKUP_S3_* repository variables/secrets as the nightly
# backup, plus GMAIL_USER / GMAIL_APP_PASSWORD for the email.
# The yearly 10-year copy is not required; a warning (never a failure) is raised from
# January 2027 if it is missing after 15 January (see the last check below).
# Encrypted backups (<name>.dump.age) are recognised: the first bytes of the
# newest object are read (a few bytes, never the whole file) and must be the age
# header (".age") or the pg_dump header (".dump"). An UNENCRYPTED newest dump
# is only a warning here (the nightly job's own warnings and weekly email cover
# that), because the freshness alert means "no backup", which is not the case.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily, six hours after the 03:00 backup
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    env:
      MAX_AGE_HOURS: "36"
    steps:
      - name: Check the newest nightly dump in Backblaze
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ] || [ -z "$AWS_DEFAULT_REGION" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Offsite backup settings are missing (BACKUP_S3_* variables/secrets)."
            exit 1
          fi
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          NEWEST=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                     --prefix "${PREFIX}/full/umas_books_full_" --delimiter "/" \
                     --query 'sort_by(Contents || `[]`, &LastModified)[-1].[Key,LastModified,Size]' --output text)
          if [ -z "$NEWEST" ] || [ "$NEWEST" = "None" ]; then
            echo "::error::No backup dumps found under ${BUCKET}/${PREFIX}/full/."
            exit 1
          fi
          KEY=$(echo "$NEWEST" | awk '{print $1}')
          WHEN=$(echo "$NEWEST" | awk '{print $2}')
          SIZE=$(echo "$NEWEST" | awk '{print $3}')
          AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$WHEN" +%s) ) / 3600 ))
          echo "Newest dump: ${KEY} (${SIZE} bytes), written ${WHEN}, ${AGE_HOURS}h ago."
          if [ "$SIZE" -le 0 ]; then
            echo "::error::The newest dump is empty."
            exit 1
          fi
          if [ "$AGE_HOURS" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::The newest dump is ${AGE_HOURS}h old (limit ${MAX_AGE_HOURS}h): the nightly backup has not produced a new file."
            exit 1
          fi
          aws s3api get-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key "$KEY" --range bytes=0-31 head.bin > /dev/null
          if [[ "$KEY" == *.age ]]; then
            if [ "$(head -c 21 head.bin)" != "age-encryption.org/v1" ]; then
              echo "::error::${KEY} is named .age but does not start with the age header."
              exit 1
            fi
            echo "The newest dump is encrypted (valid age header)."
          else
            if [ "$(head -c 5 head.bin)" != "PGDMP" ]; then
              echo "::error::${KEY} does not look like a pg_dump file."
              exit 1
            fi
            echo "::warning title=Backups are not encrypted::The newest dump (${KEY}) is NOT encrypted. Set the repository variable BACKUP_AGE_RECIPIENT (docs/runbook.md, 'Encrypting the backups')."
          fi

      - name: Check the newest monthly copy in Backblaze
        # The nightly job also keeps a long-term copy on the 1st of each month
        # (monthly/, 2-year retention). If that upload silently stopped, the
        # daily check above would stay green for a month or more. From the 4th
        # of the month on, the newest monthly/ object must be under 35 days old
        # (days 1-3 are skipped: the copy for this month may not exist yet, and
        # the previous one is still under 35 days old for most of that time).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          MAX_MONTHLY_AGE_DAYS: "35"
        run: |
          DAY_OF_MONTH=$((10#$(date -u +%d)))
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          # Null-safe: an empty monthly/ folder makes the API return "Contents: null".
          NEWEST=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                     --prefix "${PREFIX}/monthly/umas_books_full_" --delimiter "/" \
                     --query 'sort_by(Contents || `[]`, &LastModified)[-1].[Key,LastModified,Size]' --output text)
          if [ -z "$NEWEST" ] || [ "$NEWEST" = "None" ]; then
            # No monthly copy at all. Fine while the system has not had a chance
            # to make one; a failure once backups are older than the limit.
            OLDEST=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                       --prefix "${PREFIX}/full/umas_books_full_" --delimiter "/" \
                       --query 'sort_by(Contents || `[]`, &LastModified)[0].LastModified' --output text)
            if [ -n "$OLDEST" ] && [ "$OLDEST" != "None" ]; then
              OLDEST_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$OLDEST" +%s) ) / 86400 ))
              if [ "$OLDEST_DAYS" -lt "$MAX_MONTHLY_AGE_DAYS" ]; then
                echo "::notice title=No monthly copy yet::No monthly copy yet: the first one is written by the nightly backup on the 1st of next month (or the next nightly run, which writes one when none exists). Oldest backup is ${OLDEST_DAYS} days old."
                exit 0
              fi
            fi
            echo "::error::No monthly copies found under ${BUCKET}/${PREFIX}/monthly/, although backups have existed for ${MAX_MONTHLY_AGE_DAYS} days or more."
            exit 1
          fi
          if [ "$DAY_OF_MONTH" -le 3 ]; then
            echo "Day $DAY_OF_MONTH of the month: the monthly copy age check is skipped until the 4th."
            exit 0
          fi
          KEY=$(echo "$NEWEST" | awk '{print $1}')
          WHEN=$(echo "$NEWEST" | awk '{print $2}')
          SIZE=$(echo "$NEWEST" | awk '{print $3}')
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$WHEN" +%s) ) / 86400 ))
          echo "Newest monthly copy: ${KEY} (${SIZE} bytes), written ${WHEN}, ${AGE_DAYS} days ago."
          if [ "$SIZE" -le 0 ]; then
            echo "::error::The newest monthly copy is empty."
            exit 1
          fi
          if [ "$AGE_DAYS" -gt "$MAX_MONTHLY_AGE_DAYS" ]; then
            echo "::error::The newest monthly copy is ${AGE_DAYS} days old (limit ${MAX_MONTHLY_AGE_DAYS}): the 1st-of-the-month copy was not written."
            exit 1
          fi

      - name: Check the yearly copy (a warning only, from January 2027)
        # The 10-year copy is written on 2 January (nightly-db-backup.yml). It is NOT required
        # to exist: this step never fails the job, it only raises a warning annotation when,
        # after 15 January, there is no yearly/ object dated in the current Paris year.
        # Not checked before 2027: the system starts in 2026 and has no January behind it.
        # (A copy made earlier with force_yearly is dated that day and counts for its own year.)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          YEAR=$(TZ=Europe/Paris date +%Y)
          MONTH=$((10#$(TZ=Europe/Paris date +%m)))
          DAY=$((10#$(TZ=Europe/Paris date +%d)))
          if [ "$YEAR" -lt 2027 ]; then
            echo "Before 2027: the yearly copy is not checked yet."
            exit 0
          fi
          if [ "$MONTH" = "1" ] && [ "$DAY" -le 15 ]; then
            echo "Day $DAY of January: the yearly copy check starts after the 15th."
            exit 0
          fi
          PREFIX="${PREFIX:-store-backups}"
          PREFIX="${PREFIX%/}"
          # shellcheck disable=SC2016  # the backticks are JMESPath literals, not shell
          N=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                --prefix "${PREFIX}/yearly/umas_books_full_${YEAR}-" --delimiter "/" \
                --query 'length(Contents || `[]`)' --output text)
          if [ "${N:-0}" = "0" ]; then
            echo "::warning title=No yearly backup copy for ${YEAR}::There is no object under ${PREFIX}/yearly/ dated ${YEAR}. The 10-year copy should have been written on 2 January. Run the Nightly database backup workflow with force_yearly ticked (docs/runbook.md, 'Keeping records for 10 years')."
          else
            echo "Yearly copy for ${YEAR}: present (${N} object(s))."
          fi

      - name: Fetch the alert-mail action
        # A local action is read from the workspace, so fetch just .github/actions (a few KB), and only when an email is about to be sent.
        if: failure()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Alert admin if there is no fresh backup
        if: failure()
        uses: ./.github/actions/send-alert-mail
        with:
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] No fresh database backup in Backblaze"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from-name: "Uma's Books Backup Monitor"
          body: |
            The daily freshness check could not find a recent database backup in Backblaze (the newest nightly dump is missing, empty, or older than ${{ env.MAX_AGE_HOURS }} hours; or, after the 3rd of the month, the long-term monthly copy is older than 35 days), or it could not reach Backblaze.

            Check the failed run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Then open the "Nightly database backup" workflow in the Actions tab and check that it is enabled and running.
