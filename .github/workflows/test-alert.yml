name: Send a test alert

# Runs by itself every Monday morning, and by hand (Actions > "Send a
# test alert" > Run workflow), to prove that the failure-alert emails still
# arrive, e.g. after the mail action is updated. The weekly run is there so a
# revoked or expired Gmail app password (or a locked Google account) is noticed
# within a week, not on the day a real alert fails to arrive (it was monthly; a
# month is too long for the only channel every other alert depends on). It is one
# tiny job (about 1 billed minute a week): if no test email shows up in
# the alert address(es) (or the run turns red in the Actions tab), fix the
# GMAIL_USER / GMAIL_APP_PASSWORD secrets. It is safe unattended: it only
# sends one email to the alert address(es) (repository variable ALERT_TO, default admin@umasbooks.org) and touches nothing else.
# It sends the same kind of email the backup, restore-test and uptime
# workflows send when something fails. Needs the repository secrets
# GMAIL_USER and GMAIL_APP_PASSWORD (Settings > Secrets and variables >
# Actions > Secrets > Repository secrets), the same ones they use.

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Send the test email
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[umas-books] TEST alert - the alert emails work"
          to: ${{ vars.ALERT_TO || 'admin@umasbooks.org' }}
          from: "Uma's Books Backup Monitor <${{ secrets.GMAIL_USER }}>"
          body: |
            This is a test. If you can read this, failure alerts from GitHub will reach you.

            Sent from: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
