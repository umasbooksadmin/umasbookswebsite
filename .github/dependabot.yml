# Weekly update PRs for GitHub Actions and npm packages.
# Dependabot only OPENS pull requests. Nothing here merges them: every one
# needs the normal CI checks and a human to review and merge it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /umas-books
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
