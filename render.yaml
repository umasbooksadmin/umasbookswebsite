databases:
  - name: umas-books-db
    # Paid tier (matches the Render dashboard). This app's nightly pg_dump
    # (GitHub branch + Backblaze B2) is the extra safety net, see
    # .github/workflows.
    plan: 1c-2g
    region: frankfurt
    databaseName: umas_books
    user: umasbooks

services:
  - type: web
    name: umas-books
    runtime: node
    # Paid tier (matches the Render dashboard): always on, so no cold
    # start for the first visitor after a quiet spell.
    plan: 1c-2g
    region: frankfurt
    rootDir: umas-books
    # /healthz runs SELECT 1 against the database (src/index.js), so Render
    # only routes traffic to / keeps a deploy that can actually reach the DB.
    healthCheckPath: /healthz
    # rootDir alone makes Render auto-deploy only when umas-books/ changes,
    # but this service also serves the marketing pages at the repo root
    # (index.html, assets/, …) — deploy on changes anywhere in the repo.
    buildFilter:
      paths:
        - "**"
    # Lockfile-exact, and --omit=dev skips puppeteer (and its Chrome download):
    # nothing in migrate/seed/start requires a devDependency.
    buildCommand: npm ci --omit=dev
    # migrate applies each migration file once (tracked in schema_migrations);
    # seed only creates an admin if none exists yet and only seeds sample
    # announcements/charity content if none exists — safe on every startup.
    # It's how the first admin account gets onto a fresh database.
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts admins' two-step secrets in the database. Separate from
      # SESSION_SECRET so rotating the session secret doesn't break 2FA.
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HELLOASSO_CLIENT_ID
        sync: false
      - key: HELLOASSO_CLIENT_SECRET
        sync: false
      - key: HELLOASSO_ORG_SLUG
        sync: false
      - key: HELLOASSO_API_BASE
        sync: false
