databases:
  - name: umas-books-db
    # Paid tier (matches the Render dashboard). This app's nightly pg_dump
    # (uploaded to Backblaze B2) is the extra safety net, see
    # .github/workflows.
    plan: 1c-2g
    region: frankfurt
    databaseName: umas_books
    user: umasbooks

services:
  - type: web
    name: umas-books
    runtime: node
    # Paid tier (matches the Render dashboard): always on, so no cold
    # start for the first person after a quiet spell.
    plan: 1c-2g
    region: frankfurt
    rootDir: umas-books
    # /healthz runs SELECT 1 against the database (src/index.js), so Render
    # only routes traffic to / keeps a deploy that can actually reach the DB.
    healthCheckPath: /healthz
    # rootDir alone makes Render auto-deploy only when umas-books/ changes,
    # but this service also serves the marketing pages at the repo root
    # (index.html, assets/, …) — deploy on changes anywhere in the repo.
    buildFilter:
      paths:
        - "**"
    # Lockfile-exact, and --omit=dev skips puppeteer (and its Chrome download):
    # nothing in migrate/seed/start requires a devDependency.
    buildCommand: npm ci --omit=dev
    # Migrations run BEFORE the new version takes traffic: if one fails the
    # deploy is aborted and the running version keeps serving, instead of a
    # crash loop on the live site. (The migration runner is tracked and
    # takes an advisory lock, so it is safe if it ever runs twice.)
    preDeployCommand: npm run migrate
    # The seed only bootstraps a brand-new database (first admin + sample
    # content, see src/seed.js). It never blocks startup: it exits 0 even
    # when it fails (logging loudly and emailing an alert), and ";" rather
    # than "&&" makes sure of it, because a seed problem must never turn
    # into a crash loop on the live site.
    startCommand: npm run seed; npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts admins' two-step secrets in the database. Separate from
      # SESSION_SECRET so rotating the session secret doesn't break 2FA.
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HELLOASSO_CLIENT_ID
        sync: false
      - key: HELLOASSO_CLIENT_SECRET
        sync: false
      - key: HELLOASSO_ORG_SLUG
        sync: false
      - key: HELLOASSO_API_BASE
        sync: false
      # ---- Settings below were missing from this file: a Blueprint rebuild
      # (new Render account, see docs/runbook.md "Rebuild everything if the
      # Render account is lost") would have started a site with no canonical
      # address, alerts to the wrong place and no proxy setting. ----
      #
      # The public address, no trailing slash. Used for emailed links, payment
      # return URLs, the canonical-host redirect (the *.onrender.com address
      # redirects here) and sitemap/SEO. Wrong or missing = broken links in mail.
      - key: APP_BASE_URL
        value: https://umasbooks.org
      # Where contact-form messages and forum reports go (one address, or several
      # separated by commas).
      - key: CONTACT_TO
        value: admin@umasbooks.org
      # Where the site's ALERT emails go (errors, emails that cannot be sent,
      # failing background jobs, launch warnings): one address or several
      # separated by commas. Add a second one on a DIFFERENT mail provider than
      # the Google account that sends the alerts. The GitHub workflows read the
      # repository VARIABLE with the same name (Settings > Secrets and variables
      # > Actions > Variables); keep the two the same.
      - key: ALERT_TO
        value: admin@umasbooks.org,sharonbje@gmail.com
      # How many proxies sit in front of the app (decides the visitor's IP for
      # rate limits and order caps). 2 = Render's edge plus its internal proxy.
      # Verify after a deploy on /admin/diagnostics/client-ip. If a CDN is ever
      # put in front of Render this number changes: re-check it.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Optional: only payments on this HelloAsso form make someone a member (the
      # last part of the form's HelloAsso address, e.g. adhesion-2026). Not a
      # secret. Empty = any membership form of the organisation counts.
      - key: HELLOASSO_MEMBERSHIP_FORM_SLUG
        sync: false
      # Background copy of book covers onto our own server. "off" disables it
      # (tests do); anything else, or unset, leaves it on.
      - key: COVER_BACKFILL
        value: "on"
      # PREVIEW_MODE is deliberately NOT in this file. The "coming soon" mode is
      # switched on and off by hand in the Render dashboard (Environment), so a
      # Blueprint sync can never switch a live site back into preview mode (or
      # the other way round). For a rebuild, add it yourself while testing and
      # delete it at launch: see docs/runbook.md section g.
