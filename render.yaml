databases:
  - name: umas-books-db
    plan: free
    region: frankfurt
    databaseName: umas_books
    user: umasbooks

services:
  - type: web
    name: umas-books
    runtime: node
    plan: free
    region: frankfurt
    rootDir: umas-books
    # rootDir alone makes Render auto-deploy only when umas-books/ changes,
    # but this service also serves the marketing pages at the repo root
    # (index.html, assets/, …) — deploy on changes anywhere in the repo.
    buildFilter:
      paths:
        - "**"
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HELLOASSO_CLIENT_ID
        sync: false
      - key: HELLOASSO_CLIENT_SECRET
        sync: false
      - key: HELLOASSO_ORG_SLUG
        sync: false
      - key: HELLOASSO_API_BASE
        sync: false
