databases:
  - name: umas-books-db
    # Paid tier (matches the Render dashboard): the free Postgres expires 30
    # days after creation. This app's nightly pg_dump (GitHub + S3) is the
    # extra safety net, see .github/workflows.
    plan: 1c-2g
    region: frankfurt
    databaseName: umas_books
    user: umasbooks

services:
  - type: web
    name: umas-books
    runtime: node
    # Paid tier: the free web service sleeps after 15 minutes without
    # traffic, so the first visitor after a quiet spell waited through a
    # cold start (migrate + seed + boot) — see startCommand below.
    plan: 1c-2g
    region: frankfurt
    rootDir: umas-books
    # /healthz runs SELECT 1 against the database (src/index.js), so Render
    # only routes traffic to / keeps a deploy that can actually reach the DB.
    healthCheckPath: /healthz
    # rootDir alone makes Render auto-deploy only when umas-books/ changes,
    # but this service also serves the marketing pages at the repo root
    # (index.html, assets/, …) — deploy on changes anywhere in the repo.
    buildFilter:
      paths:
        - "**"
    # Lockfile-exact, and --omit=dev skips puppeteer (and its Chrome download):
    # nothing in migrate/seed/start requires a devDependency.
    buildCommand: npm ci --omit=dev
    # seed is idempotent (only creates an admin if none exists yet, only
    # seeds sample announcements/charity content if none exists) — safe to
    # run on every startup. It's how the first admin account gets onto a
    # fresh database without needing a Shell session to run one-off commands.
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HELLOASSO_CLIENT_ID
        sync: false
      - key: HELLOASSO_CLIENT_SECRET
        sync: false
      - key: HELLOASSO_ORG_SLUG
        sync: false
      - key: HELLOASSO_API_BASE
        sync: false
