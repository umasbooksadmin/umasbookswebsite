databases:
  - name: umas-books-db
    plan: free
    region: frankfurt
    databaseName: umas_books
    user: umasbooks

services:
  - type: web
    name: umas-books
    runtime: node
    plan: free
    region: frankfurt
    rootDir: umas-books
    # /healthz runs SELECT 1 against the database (src/index.js), so Render
    # only routes traffic to / keeps a deploy that can actually reach the DB.
    healthCheckPath: /healthz
    # rootDir alone makes Render auto-deploy only when umas-books/ changes,
    # but this service also serves the marketing pages at the repo root
    # (index.html, assets/, …) — deploy on changes anywhere in the repo.
    buildFilter:
      paths:
        - "**"
    buildCommand: npm install
    # seed is idempotent (only creates an admin if none exists yet, only
    # seeds sample announcements/charity content if none exists) — safe to
    # run on every startup. This matters on the free plan specifically,
    # which has no Shell tab to run one-off commands from, so this is the
    # only way to get the first admin account onto a fresh database.
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umas-books-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HELLOASSO_CLIENT_ID
        sync: false
      - key: HELLOASSO_CLIENT_SECRET
        sync: false
      - key: HELLOASSO_ORG_SLUG
        sync: false
      - key: HELLOASSO_API_BASE
        sync: false
