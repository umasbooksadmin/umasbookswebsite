databases:
  - name: umasbooks-members-db
    plan: free
    region: frankfurt
    databaseName: umasbooks_members
    user: umasbooks

services:
  - type: web
    name: umasbooks-members
    runtime: node
    plan: free
    region: frankfurt
    rootDir: members-app
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umasbooks-members-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
